<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style/connexion.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Slabo+27px&display=swap"
      rel="stylesheet"
    />
    <title>connexion</title>
  </head>
  <body>
    <div class="formulaire">
      <h1>Connexion</h1>
      <form action="produits.html" method="get">
        <div class="email">
          <label for="email">Email :</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemple@gmail.com"
            required
          />
        </div>
        <div class="password">
          <label for="password">Mot de passe :</label>
          <input type="password" id="password" name="password" required />
        </div>
        <div class="envoyer">
          <input type="submit" value="Se connecter" />
        </div>
      </form>
    </div>
  </body>
</html>
